<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JLPT Prep</title>
  <meta name="description" content="Cover every N4, N3 and N2 kanji and vocabulary card, one at a time.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12141c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="JLPT Prep">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-title" id="sheet-title"></div>
      <div class="sheet-buttons">
        <button type="button" class="sheet-btn" data-status="pending"><span class="sq pending"></span>Pending</button>
        <button type="button" class="sheet-btn" data-status="review"><span class="sq review"></span>Review</button>
        <button type="button" class="sheet-btn" data-status="done"><span class="sq done"></span>Done</button>
      </div>
      <button type="button" class="sheet-cancel" data-close>Cancel</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
